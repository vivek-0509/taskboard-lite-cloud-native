apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskboard-lite.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskboard-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  FEATURE_FLAGS: {{ .Values.config.featureFlags | quote }}
  APP_VERSION: {{ include "taskboard-lite.appVersion" . | quote }}
