{{- if .Values.secret.create }}
# DEMO ONLY: real values come from a vault / sealed secret (see values.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard-lite.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskboard-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
{{- end }}
