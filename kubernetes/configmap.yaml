apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-config
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard-lite
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: taskboard-lite
data:
  # Non-secret runtime configuration; injected with envFrom in deployment.yaml.
  APP_ENV: production
  LOG_LEVEL: INFO
  FEATURE_FLAGS: dark-mode,metrics
  APP_VERSION: "1.0.0"
