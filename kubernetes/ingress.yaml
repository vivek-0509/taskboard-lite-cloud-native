# Requires an NGINX ingress controller (minikube addons enable ingress) and a
# hosts entry: echo "$(minikube ip) taskboard.local" | sudo tee -a /etc/hosts
# On Apple Silicon with the docker driver use `minikube tunnel` and map
# taskboard.local to 127.0.0.1 instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard-lite
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard-lite
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: taskboard-lite
spec:
  ingressClassName: nginx
  rules:
    - host: taskboard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskboard-lite
                port:
                  number: 80
