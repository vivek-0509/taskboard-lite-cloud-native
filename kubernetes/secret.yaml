# DEMO ONLY.
#
# A Secret in plain YAML is only acceptable for a classroom cluster. In a real
# environment this file must never contain the actual value: it is either
# created out of band (kubectl create secret ... from a CI variable), pulled
# from a vault (External Secrets Operator / HashiCorp Vault / AWS Secrets
# Manager) or committed encrypted (Sealed Secrets / SOPS). The value below only
# exists so that /api/config can prove the injection works (db_password_set=true).
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-secret
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard-lite
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: taskboard-lite
type: Opaque
stringData:
  DB_PASSWORD: "demo-only-change-me"
