# Prometheus configuration for the docker compose stack (docker/docker-compose.yml).
# Mounted at /etc/prometheus/prometheus.yml; alerts.yml sits next to it.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # Prometheus scrapes itself so its own health is visible.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # TaskBoard Lite exposes prometheus_client metrics on /metrics.
  # "app" is the compose service name, 8000 is the gunicorn port.
  - job_name: taskboard
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8000
        labels:
          app: taskboard-lite
          env: dev
