# Grafana dashboard provider: every *.json in this directory becomes a dashboard.
apiVersion: 1

providers:
  - name: taskboard
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
