# Local stack: application + Prometheus + Grafana.
#
#   cd docker
#   mkdir -p data && chmod 777 data   # the container runs as uid 10001; the bind mount must be writable
#   docker compose up --build
#
#   App         http://localhost:8000
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3000   (anonymous admin, no login)

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: taskboard-lite:local
    container_name: taskboard-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      LOG_LEVEL: DEBUG
      FEATURE_FLAGS: dark-mode,metrics
      APP_VERSION: 1.0.0-compose
      # Demo value only; override with `DB_PASSWORD=... docker compose up`.
      DB_PASSWORD: ${DB_PASSWORD:-compose-demo-only}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: taskboard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: taskboard-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
