# Scenario 03 - missing Secret key -> CreateContainerConfigError
#
# BUG: the container asks for key "DB_PASS" in Secret taskboard-secret, but the
# Secret only has the key "DB_PASSWORD" (see kubernetes/secret.yaml). The
# image is pulled fine, yet the kubelet cannot build the container's
# environment, so the pod sits in CreateContainerConfigError and never starts:
#   Error: couldn't find key DB_PASS in Secret taskboard/taskboard-secret
#
# FIX: reference the key that exists: DB_PASSWORD
#   kubectl -n taskboard patch deployment taskboard-broken-secret --type json \
#     -p '[{"op":"replace","path":"/spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/key","value":"DB_PASSWORD"}]'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-broken-secret
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard-lite-broken
    app.kubernetes.io/instance: scenario-03
    app.kubernetes.io/part-of: taskboard-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard-lite-broken
      app.kubernetes.io/instance: scenario-03
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard-lite-broken
        app.kubernetes.io/instance: scenario-03
        app.kubernetes.io/part-of: taskboard-lite
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: taskboard-lite
          image: taskboard-lite:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: taskboard-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskboard-secret
                  key: DB_PASS   # <-- BUG: the Secret's key is DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          emptyDir: {}
