# Final DevOps Pipeline for TaskBoard Lite.
#
# Lives at .github/workflows/final-pipeline.yml, so GitHub runs it on every push
# to main. All paths are relative to the repository root.
#
# Stages (each one needs the previous one):
#   test -> sast -> sca -> secret-scan -> docker-build -> image-scan -> security-gate
#   -> push-image (push to main only) -> deploy-kubernetes (kind + helm)

name: Final DevOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha || 'local' }}   # commit SHA on GitHub, 'local' when run with act
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/taskboard-lite
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------- 1. tests
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ !env.ACT }}   # act (local run) uses the runner image's Python instead
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: application/requirements-dev.txt
      - name: Python venv when running locally with act
        if: ${{ env.ACT }}
        run: |
          python3 -m venv /tmp/venv && echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -r application/requirements-dev.txt

      - name: Run pytest with coverage
        working-directory: application
        run: |
          pytest -v \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml \
            --junitxml=junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            application/junit.xml
            application/coverage.xml
          if-no-files-found: error

  # ----------------------------------------------------------------- 2. SAST
  sast:
    name: SAST (bandit)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ !env.ACT }}   # act (local run) uses the runner image's Python instead
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python venv when running locally with act
        if: ${{ env.ACT }}
        run: |
          python3 -m venv /tmp/venv && echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Install bandit
        run: pip install bandit==1.8.3

      - name: Run bandit (JSON report, all severities)
        run: bandit -r application -c security/bandit.yaml -f json -o bandit-report.json --exit-zero

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Fail on HIGH severity findings
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("bandit-report.json"))
          results = report["results"]
          high = [r for r in results if r["issue_severity"] == "HIGH"]
          print(f"bandit findings: total={len(results)} high={len(high)}")
          for r in results:
              print(f"  [{r['issue_severity']}/{r['issue_confidence']}] {r['test_id']} {r['filename']}:{r['line_number']} {r['issue_text']}")
          sys.exit(1 if high else 0)
          PY

  # ------------------------------------------------------------------ 3. SCA
  sca:
    name: SCA (pip-audit)
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ !env.ACT }}   # act (local run) uses the runner image's Python instead
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python venv when running locally with act
        if: ${{ env.ACT }}
        run: |
          python3 -m venv /tmp/venv && echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Audit runtime dependencies (JSON report)
        continue-on-error: true
        run: pip-audit -r application/requirements.txt --strict -f json -o pip-audit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: Fail on known vulnerabilities
        run: pip-audit -r application/requirements.txt --strict --desc on

  # ----------------------------------------------------------- 4. secret scan
  secret-scan:
    name: Secret scanning (gitleaks)
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - name: Check out (full history so every commit is scanned)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        if: ${{ !env.ACT }}   # GitHub-only action, skipped under act
        uses: gitleaks/gitleaks-action@v2

      - name: gitleaks (local act fallback, same rules)
        if: ${{ env.ACT }}
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo -c /repo/security/.gitleaks.toml --no-banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  # ----------------------------------------------------------- 5. image build
  docker-build:
    name: Build image
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Normalise image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build
        run: docker build -f docker/Dockerfile -t "$IMAGE_NAME:${{ env.IMAGE_TAG }}" .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 "$IMAGE_NAME:${{ env.IMAGE_TAG }}"
          for _ in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          echo
          curl -fsS http://localhost:8000/ready
          echo
          docker logs smoke
          docker rm -f smoke

      - name: Save image
        run: docker save "$IMAGE_NAME:${{ env.IMAGE_TAG }}" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskboard-image
          path: image.tar
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------ 6. image scan
  image-scan:
    name: Image scan (trivy)
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Normalise image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: taskboard-image
          path: .

      - name: Load image
        run: docker load -i image.tar

      - name: Trivy scan (fails on HIGH/CRITICAL with a fix available)
        if: ${{ !env.ACT }}   # marketplace action on GitHub
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: security/.trivyignore

      - name: Trivy scan (local act fallback, same settings via the Trivy container)
        if: ${{ env.ACT }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security/trivy.yaml:/trivy.yaml:ro" \
            aquasec/trivy:0.66.0 image --config /trivy.yaml --scanners vuln --format table ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Trivy SARIF report
        if: ${{ always() && !env.ACT }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true
          trivyignores: security/.trivyignore

      - name: Upload SARIF to the Security tab
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Upload SARIF artifact
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif

  # --------------------------------------------------------- 7. security gate
  security-gate:
    name: Security gate
    needs: [test, sast, sca, secret-scan, docker-build, image-scan]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      RESULT_TEST: ${{ needs.test.result }}
      RESULT_SAST: ${{ needs.sast.result }}
      RESULT_SCA: ${{ needs.sca.result }}
      RESULT_SECRETS: ${{ needs.secret-scan.result }}
      RESULT_BUILD: ${{ needs.docker-build.result }}
      RESULT_IMAGE: ${{ needs.image-scan.result }}
    steps:
      - name: Summarise results
        run: |
          {
            echo "## Security gate"
            echo ""
            echo "| Stage | Tool | Result |"
            echo "|-------|------|--------|"
            echo "| Unit tests | pytest | $RESULT_TEST |"
            echo "| SAST | bandit | $RESULT_SAST |"
            echo "| SCA | pip-audit | $RESULT_SCA |"
            echo "| Secret scanning | gitleaks | $RESULT_SECRETS |"
            echo "| Image build | docker | $RESULT_BUILD |"
            echo "| Image scan | trivy | $RESULT_IMAGE |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Block the pipeline if any stage did not succeed
        run: |
          failed=0
          for stage in RESULT_TEST RESULT_SAST RESULT_SCA RESULT_SECRETS RESULT_BUILD RESULT_IMAGE; do
            result="${!stage}"
            if [ "$result" != "success" ]; then
              echo "::error::${stage#RESULT_} finished with result '$result'"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Security gate: BLOCKED** - the image is not pushed and nothing is deployed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Security gate: PASSED**" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------ 8. push image
  push-image:
    name: Push image to GHCR
    needs: security-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Normalise image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: taskboard-image
          path: .

      - name: Load image
        run: docker load -i image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push sha and latest tags
        run: |
          docker tag "$IMAGE_NAME:${{ env.IMAGE_TAG }}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ env.IMAGE_TAG }}"
          docker push "$IMAGE_NAME:latest"
          echo "Pushed $IMAGE_NAME:${{ env.IMAGE_TAG }} and $IMAGE_NAME:latest" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------- 9. deploy to kind
  deploy-kubernetes:
    name: Deploy to Kubernetes (kind + helm)
    needs: [security-gate, push-image]
    # Runs after a successful gate; push-image is skipped on workflow_dispatch and that is fine.
    if: >-
      always()
      && needs.security-gate.result == 'success'
      && (needs.push-image.result == 'success' || needs.push-image.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Normalise image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: taskboard-image
          path: .

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: taskboard-ci
          wait: 120s

      - name: Load image into kind
        run: kind load image-archive image.tar --name taskboard-ci

      - name: Deploy with Helm
        run: |
          helm upgrade --install taskboard-lite helm/taskboard-lite \
            --namespace taskboard --create-namespace \
            --set image.repository="$IMAGE_NAME" \
            --set image.tag="${{ env.IMAGE_TAG }}" \
            --set persistence.enabled=false \
            --set ingress.enabled=false \
            --wait --timeout 180s

      - name: Wait for rollout
        run: |
          kubectl -n taskboard rollout status deployment/taskboard-lite --timeout=180s
          kubectl -n taskboard get deploy,pods,svc,hpa -o wide

      - name: Smoke test through a port-forward
        run: |
          kubectl -n taskboard port-forward svc/taskboard-lite 8080:80 > /tmp/port-forward.log 2>&1 &
          for _ in $(seq 1 15); do
            curl -fsS http://localhost:8080/health && break
            sleep 2
          done
          echo
          curl -fsS http://localhost:8080/ready
          echo
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"title":"deployed from CI"}' http://localhost:8080/api/tasks
          echo
          curl -fsS http://localhost:8080/api/tasks
          echo
          curl -fsS http://localhost:8080/api/config
          echo

      - name: Pod logs (debugging aid)
        if: always()
        run: kubectl -n taskboard logs deployment/taskboard-lite --all-containers --tail=100 || true
